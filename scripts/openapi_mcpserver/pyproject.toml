[project]
name = "insurance-openapi-mcp"
version = "0.1.0"
description = "Configuration-driven FastMCP OpenAPI prototype with upstream token authentication"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastmcp==4.2.0",
    "httpx2==2.16.0",
    "PyYAML==6.0.3",
    "pydantic>=2.14,<3",
    "jsonschema>=4.26,<5",
    "python-dotenv==1.2.4",
    "genson>=1.3,<2",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
