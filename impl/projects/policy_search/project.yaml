schema_version: 1
project:
  id: policy_search
  name: 保单搜索解析
  description: 评估 Policy Search 将自然语言保单筛选意图转换为可执行查询语法树的正确性、完整性与安全失败能力
  capabilities:
  - live_run
  - judge
  - attribute
  - check
  - scenario
  - multi_turn
  resources:
    source:
      repository: ''
      paths:
        api_contract: business://docs/保单搜索算法解析接口文档（智能体对接稿）.md
        filter_contract: business://docs/保单搜索查询语法树协议（首期精简版）.md
        technical_design: business://docs/保单搜索算法解析技术方案（当前实现版）.md
        business_config: business://src/main/python/policy_search/configs/insurance_search_business_config_prd.json
        runtime_config: business://src/main/python/policy_search/configs/insurance_search_runtime_config_prd.json
        golden_manifest: business://src/main/python/policy_search/data/golden_dataset/manifest.json
runtime:
  mode: existing_service_required
  application:
    interface:
      shape: AskBob envelope POST returning code/msg and policySearchParseResult filter
        tree
      source: business API and filter protocol documents
    start_run: connect to the user-managed policy-search service on 127.0.0.1:8050;
      verifier never starts or restarts it
    boundary: parser owns request interpretation and filter generation; downstream
      policy data retrieval is out of scope
  local_deployment:
    enabled: false
  session:
    max_turns: 3
  ready: []
  services:
    primary:
      base_url: http://127.0.0.1:8050
      endpoint: /api/v1/policy-search/policy-search-parse
      method: POST
      timeout_seconds: 120
      healthcheck:
        endpoint: /api/v1/policy-search/health/ready
        request_timeout_seconds: 5
        interval_seconds: 1
        startup_timeout_seconds: 60
  mock_cases:
    source: dynamic
    default_scenarios:
    - atomic_condition
    - compound_logic
    - time_boundary
    - enum_alias
    - agent_identity
    - context_disambiguation
    - clarification
    - clarification_reply
    - clarification_then_new_query
    - unsupported
    - surface_generalization
  adapter:
    request_construction:
      builder: PolicySearchMock.build_initial_request creates the exact AskBob request
        envelope
      required_inputs:
      - session_id
      - trace_id
      - extra_input_params
    output_extraction:
      extractor: PolicySearchLive.extract_output unwraps policySearchParseResult and
        preserves code/msg
      normalized_output: code, msg, status, query, filter, message
    reference_handling:
      source_priority:
      - input_reference
      - judge_generated
      - missing
      alignment: compare filter trees by business semantics rather than node_id spelling
  batch_persistence:
    case_shape: id, selected, input, output, reference, metadata, scenario, source,
      status, error
    transient_results: do not persist trace, judge, attribute, or frontend_view as
      durable case-pool data
verifier:
  attribution:
    enabled: false
    trace:
      document: reference.md
      trace_nodes:
      - request_construction
      - http_delivery
      - output_extraction
      - semantic_judge
      - attribution
  scenarios:
    allowed:
    - atomic_condition
    - compound_logic
    - time_boundary
    - enum_alias
    - agent_identity
    - context_disambiguation
    - clarification
    - clarification_reply
    - clarification_then_new_query
    - unsupported
    - surface_generalization
    interactive:
    - clarification_reply
    - clarification_then_new_query
  judge:
    boundary:
      document: judge_boundary.md
      gate: separate external service availability from filter semantic correctness
        before comparison
  presentation:
    frontend_view:
      live: render query, status, message and the normalized filter tree
      summary: render scenario, query, status and compact filter semantics
  check_rules:
    require_scenario: false
    core_forbidden_markers: []
    evidence:
      documents:
      - startup
      - api
      - requirements
      - judge_boundary
      - reference
      tests: []
environment:
  variables:
    POLICY_SEARCH_REPO:
      bind: project.resources.source.repository
      type: path
      required: true
      secret: false
      description: policy-search business source and local startup root
    POLICY_SEARCH_BASE_URL:
      bind: runtime.services.primary.base_url
      type: url
      required: false
      secret: false
      description: policy-search service base URL, defaults to http://127.0.0.1:8050
metadata:
  initialized_from: route://project.yaml
  source_revision: c37a8fb6072074ef468a45b5cf8a8202ac8ba57b0071eaf6b5559b6eefa447eb
  accepted_proposal_sha256: 36536eb0aaccd9e9b56ed0ee583856ec412596eeca05cb7370aa6121735eb565
