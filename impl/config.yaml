schema_version: 1

python:
  executable: python

server:
  host: 127.0.0.1
  port: 8022

uat:
  host: 127.0.0.1
  port: 8023

browser:
  driver_path: chromedriver

llm:
  protocol: openai_compatible
  provider: deepseek
  model: deepseek-v4-pro
  base_url: https://api.deepseek.com/v1
  temperature: 0
  reasoning_effort: high
  request_timeout_seconds: 600
  # 流式取回。中转站前面的网关（ALB 默认 60s、Cloudflare 100s）超时看的是两次收包间隔，
  # 非流式要等整段生成完才回第一个字节，大 prompt 必撞 504；流式 prefill 一结束就持续收包。
  stream: true
  capabilities:
    json_mode: true
    tool_calls: true
    context_window_tokens: 131072
  role_policies:
    live_stub:
      model: deepseek-chat
      reasoning_effort: low

embedding:
  enabled: true
  provider: bailian
  model: text-embedding-v4
  dimensions: 1024
  retrieval_top_k: 8
  trust_env_proxy: false

execution:
  case_retry_attempts: 3
  batch_concurrency_default: 4
  batch_concurrency_max: 8
  batch_event_history_limit: 200

context:
  data_root: verifier://impl/data/context_runtime
  store_root: verifier://impl/data/context_store
  max_records_per_project: 500
  candidate_limit: 20
  load_limit: 8
  content_char_budget: 100000
  query_limit: 4
  top_k_per_query: 5

judge:
  raw_response_max_chars: 4000

# 扩展评估轴（spec/adapter/axe-v4.md）的模型策略，只影响扩展轴，不影响生产 judge / 裁决：
#   any        按公共 LLM 路由回退，哪个端点可用就用哪个
#   same_model 只允许与角色策略同名模型的端点（中转站可不同）；同模型都不可用则该轴 failed，不换模型顶替
# 可用 .env 的 EVAL_AXES_MODEL_POLICY 覆盖。
# 知识源（ES 等）不在这里：各业务系统各自独立，按名字登记在 impl/data/<project>/knowledge_sources.json。
eval_axes:
  model_policy: any

attribute:
  tool_call_limit: 8
  investigation_error_chars: 2000
  finalization_prompt_char_budget: 160000
  review_prompt_char_budget: 180000
  compaction:
    list_item_limit: 20
    attribute_result_chars: 12000
    project_context_chars: 4000
    trace_input_chars: 1200
    trace_normalized_request_chars: 1200
    trace_output_chars: 10000
    trace_execution_chars: 2500
    trace_error_chars: 1200
    judge_business_expectations_chars: 3000
    judge_fulfillment_assessments_chars: 4000
    judge_gap_chars: 1500
    judge_reasoning_chars: 2000

# 请通过.env环境变量指定下述绑定配置
environment:
  variables:
    PYTHON_EXECUTABLE:
      bind: python.executable
      type: string
      required: false
      secret: false
      description: verifier 使用的 Python 解释器或可执行命令

    VERIFIER_HOST:
      bind: server.host
      type: string
      required: false
      secret: false
      description: verifier server 监听地址

    VERIFIER_PORT:
      bind: server.port
      type: integer
      required: false
      secret: false
      description: verifier server 监听端口

    VERIFIER_UAT_HOST:
      bind: uat.host
      type: string
      required: false
      secret: false
      description: verifier UAT 服务监听地址

    VERIFIER_UAT_PORT:
      bind: uat.port
      type: integer
      required: false
      secret: false
      description: verifier UAT 服务监听端口

    CHROMEDRIVER_PATH:
      bind: browser.driver_path
      type: path
      required: false
      secret: false
      description: Selenium checklist 使用的 ChromeDriver 可执行文件或命令

    LLM_PROVIDER:
      bind: llm.provider
      type: string
      required: false
      secret: false
      description: 临时覆盖公共 LLM provider

    LLM_MODEL:
      bind: llm.model
      type: string
      required: false
      secret: false
      description: 临时覆盖公共 LLM model

    LLM_REQUEST_TIMEOUT_SECONDS:
      bind: llm.request_timeout_seconds
      type: number
      required: false
      secret: false
      description: 临时覆盖单次 LLM 请求的超时秒数（yaml 默认 600）。对照跑批在自己进程里把它压短，挂起的请求不用等满 10 分钟才切端点

    LLM_STREAM:
      bind: llm.stream
      type: boolean
      required: false
      secret: false
      description: 是否流式取回 LLM 回复（默认 true）。false 退回非流式，只在排查中转站不支持 SSE 时用

    LLM_BASE_URL:
      bind: llm.base_url
      type: url
      required: false
      secret: false
      description: 临时覆盖公共 LLM base URL

    DEEPSEEK_API_KEY:
      bind: llm.api_key
      type: string
      required: true
      secret: true
      description: verifier 默认 DeepSeek API Key

    LLM_LIVE_STUB_MODEL:
      bind: llm.role_policies.live_stub.model
      type: string
      required: false
      secret: false
      description: 临时覆盖 live_stub 角色的 LLM model

    LLM_FALLBACK_1_BASE_URL:
      bind: llm.fallback_1.base_url
      type: url
      required: false
      secret: false
      description: 备用 LLM 端点 1 的 base URL（主端点不可用时自动降级）

    LLM_FALLBACK_1_MODEL:
      bind: llm.fallback_1.model
      type: string
      required: false
      secret: false
      description: 备用 LLM 端点 1 的 model

    LLM_FALLBACK_1_API_KEY:
      bind: llm.fallback_1.api_key
      type: string
      required: false
      secret: true
      description: 备用 LLM 端点 1 的 API Key

    LLM_FALLBACK_1_MAX_PROMPT_CHARS:
      bind: llm.fallback_1.max_prompt_chars
      type: integer
      required: false
      secret: false
      description: 备用 LLM 端点 1 可接受的 prompt 字符上限；不填则不做预检过滤

    LLM_FALLBACK_1_TOOL_CALLS:
      bind: llm.fallback_1.tool_calls
      type: boolean
      required: false
      secret: false
      description: 备用 LLM 端点 1 能否真正执行工具调用；默认 true，不支持就填 false（带工具的请求不再发给它）

    LLM_FALLBACK_2_BASE_URL:
      bind: llm.fallback_2.base_url
      type: url
      required: false
      secret: false
      description: 备用 LLM 端点 2 的 base URL（主端点与备1不可用时自动降级）

    LLM_FALLBACK_2_MODEL:
      bind: llm.fallback_2.model
      type: string
      required: false
      secret: false
      description: 备用 LLM 端点 2 的 model

    LLM_FALLBACK_2_API_KEY:
      bind: llm.fallback_2.api_key
      type: string
      required: false
      secret: true
      description: 备用 LLM 端点 2 的 API Key

    LLM_FALLBACK_2_MAX_PROMPT_CHARS:
      bind: llm.fallback_2.max_prompt_chars
      type: integer
      required: false
      secret: false
      description: 备用 LLM 端点 2 可接受的 prompt 字符上限；不填则不做预检过滤

    LLM_FALLBACK_2_TOOL_CALLS:
      bind: llm.fallback_2.tool_calls
      type: boolean
      required: false
      secret: false
      description: 备用 LLM 端点 2 能否真正执行工具调用；默认 true

    LLM_MAX_PROMPT_CHARS:
      bind: llm.max_prompt_chars
      type: integer
      required: false
      secret: false
      description: 主端点可接受的 prompt 字符上限；不填则不做预检过滤

    LLM_TOOL_CALLS:
      bind: llm.tool_calls
      type: boolean
      required: false
      secret: false
      description: 主端点能否真正执行工具调用；默认 true，不支持就填 false

    BAILIAN_API_KEY:
      bind: embedding.api_key
      type: string
      required: false
      required_when:
        field: embedding.enabled
        equals: true
      secret: true
      description: embedding.enabled=true 时必须提供的百炼 API Key

    EMBEDDING_ENABLED:
      bind: embedding.enabled
      type: boolean
      required: false
      secret: false
      description: 是否启用正式 ContextUnit embedding 能力

    BAILIAN_EMBEDDING_MODEL:
      bind: embedding.model
      type: string
      required: false
      secret: false
      description: 临时覆盖百炼 embedding model

    BAILIAN_EMBEDDING_TRUST_ENV_PROXY:
      bind: embedding.trust_env_proxy
      type: boolean
      required: false
      secret: false
      description: embedding HTTP 会话是否继承系统代理

    CONTEXT_DATA_ROOT:
      bind: context.data_root
      type: path
      required: false
      secret: false
      description: Context runtime 数据目录

    CONTEXT_STORE_ROOT:
      bind: context.store_root
      type: path
      required: false
      secret: false
      description: LLM context 记录存储目录

    EVAL_AXES_MODEL_POLICY:
      bind: eval_axes.model_policy
      type: string
      required: false
      secret: false
      description: 扩展评估轴的模型策略：any=按路由回退能用哪个端点用哪个；same_model=只允许与角色策略同名模型的端点（中转站可不同），同模型都不可用则该轴 failed。只影响扩展评估轴，不影响生产 judge/裁决

