schema_version: 1

project:
  id: llm_probe_loop
  name: 非流式 HTTP LLM 探针
  description: 用 curl 形状的非流式请求探测带 LLM 的接口，按能力描述和可选 show_schema 做 judge

documents:
  requirements:
    path: route://demand.md
    type: requirements
    required: true
    description: 探针项目的评测目标、范围和非目标
  api:
    path: route://api.md
    type: api
    required: true
    description: curl 信封请求、字符串化响应和错误语义
  judge_boundary:
    path: route://judge_boundary.md
    type: judge_boundary
    required: true
    description: 可评价范围和外部被测服务责任边界

onboarding:
  interaction: single_turn
  ready: []
